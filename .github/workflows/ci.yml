name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required check. Everything else can be argued about; the game being
  # completable cannot (TESTING.md §12).
  beatability:
    name: bot beatability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: unit · determinism · replay · bots · fuzz
        run: npm test

  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  e2e:
    name: e2e against the shipped image
    runs-on: ubuntu-latest
    needs: [beatability, static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: build (for the bundle-size budget)
        run: npm run build
      - name: playwright
        run: npm run e2e
        env:
          CI: '1'

      # The same script smoke:live runs against the deployed site, pointed at
      # the image instead. Everything it asserts about the *artifact* — cache
      # headers, noindex, security headers, asset immutability, the service
      # worker — is nginx.conf behaviour baked into the container, so it can be
      # checked here rather than only after a deploy. None of it was covered:
      # the e2e specs assert no response headers at all, and smoke.yml was
      # skipping itself green.
      #
      # The expected-SHA argument is deliberately omitted. That one assertion
      # is about *deployment* — whether the homelab actually pulled — and is
      # the reason smoke:live still runs for real after `npm run deploy`,
      # along with DNS, the tunnel, Caddy's routing and TLS, none of which
      # exist on this runner.
      - name: smoke the image itself
        run: |
          bash scripts/serve-image.sh 8123 &
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8123/index.html >/dev/null 2>&1 && break
            sleep 1
          done
          npm run smoke:live -- http://127.0.0.1:8123
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: visual regression
    runs-on: ubuntu-latest
    needs: [beatability, static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No `playwright install` here on purpose: scripts/visual.sh runs the
      # browsers inside the pinned Playwright image, which is the whole reason
      # the committed baselines match on a workstation and on this runner.
      - run: npm run visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # The diff/actual PNGs — the only way to judge whether a visual
          # failure is a regression or an intended change to re-baseline.
          name: visual-diff
          path: test-results/
          retention-days: 7

  balance:
    name: balance report
    runs-on: ubuntu-latest
    needs: [beatability]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run balance -- --seeds 200
      - name: fail if the committed report is stale
        run: |
          if ! git diff --quiet -- reports/balance.md; then
            echo "::warning::reports/balance.md is out of date — regenerate and commit it alongside the tuning change"
            git --no-pager diff -- reports/balance.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: balance
          path: reports/balance.md
