name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  wait-for-ci:
    name: require ci
    runs-on: ubuntu-latest
    steps:
      # ci.yml must be green before this workflow publishes (TESTING.md §12).
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: bot beatability
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  publish:
    name: ghcr
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The published tag is intentionally rolling (`latest`); every build also
      # gets an immutable `sha-<short>` so a rollback is a tag change on
      # whatever runs the image (DEPLOY.md §3).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          tags: |
            ghcr.io/tpatzelt/birthday-bash:latest
            ghcr.io/tpatzelt/birthday-bash:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: what to write down
        run: |
          echo "rollback tag: sha-${{ steps.sha.outputs.short }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "to roll back, run that tag instead of \`latest\` (DEPLOY.md §3)" >> "$GITHUB_STEP_SUMMARY"
