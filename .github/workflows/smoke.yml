name: smoke

# Manual only, on purpose. This used to fire automatically after
# build-and-publish, which could never be right: the homelab forwards no router
# ports, so nothing in Actions can deploy to it, and the pull + recreate happens
# by hand afterwards. The old trigger therefore smoked whatever was live
# *before* the publish — and passed, because SMOKE_URL was unset and the job
# skipped itself green.
#
# Deploying and smoking are one step now: `npm run deploy -- <url>`. Use this
# workflow to re-check the live site at any time, and on the morning of the
# party (TESTING.md §10).
on:
  workflow_dispatch:
    inputs:
      url:
        description: Live URL to smoke
        required: false

jobs:
  smoke:
    name: smoke the live URL
    runs-on: ubuntu-latest
    # SMOKE_URL is a repository secret: the real hostname never appears in a
    # tracked file (DEPLOY.md).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: resolve target
        id: target
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          SECRET_URL: ${{ secrets.SMOKE_URL }}
        run: |
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            # Never skip-and-pass. A smoke job that reports success without
            # having fetched anything is worse than no smoke job: it was green
            # all through 2026-08-13 while testing nothing at all.
            echo "::error::no SMOKE_URL secret and no url input — nothing was smoked"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # No sleep-and-hope any more: this workflow is dispatched by a human who
      # has already deployed, so the pull has happened by definition.
      - name: smoke:live
        run: npm run smoke:live -- "${{ steps.target.outputs.url }}" "$(git rev-parse --short HEAD)"
